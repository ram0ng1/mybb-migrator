ramon-mybb-migrator:
  lib:
    errors:
      generic: Something went wrong. Please try again.
      network: Network error. Check your connection and try again.

  admin:
    run_failed: Could not start the migration step.
    cancel_failed: Could not complete the action.

    tabs:
      connection: Connection
      migrate: Migration
      images: Images & attachments
      compare: Compare
      cleanup: Advanced / cleanup
      diag: Diagnostics

    connection:
      title: MyBB database connection
      intro: >-
        Point this at the MyBB database. These are the same settings the CLI
        commands use; the panel runs the very same migration in the background.
      save_failed: Could not save the connection.
      test_failed: Could not test the connection.
      test: Test connection
      save: Save
      saved: Connection saved.
      test_ok: Connected to MyBB — connection saved and now used by the migration.
      test_fail: Connection failed
      password_set: "(unchanged — leave blank to keep)"
      password_empty: "(no password)"
      php_binary: PHP binary (optional)
      php_auto: Uses Flarum's PHP
      php_from_flarum: same PHP as Flarum
      php_override: manual override
      php_none: Could not determine Flarum's PHP — set the path manually.
      old_site_url: Old site URL (for the Compare tab)
      old_site_hint: Base URL of the live MyBB forum, e.g. https://example.com — used to link/preview the original post.
      fields:
        host: Host
        port: Port
        user: User
        password: Password
        db: Database
        prefix: Table prefix

    preflight:
      title: Pre-flight checks
      legacy_table: "Legacy passwords table (run: php flarum migrate)"
      steps_table: Migration status table
      extensions: Target extensions
      required: required

    progress:
      title: Progress (MyBB → Flarum)
      no_source: Source counts unavailable — test the connection first.
      loading: Counting rows on both sides…
      recount: Recount
      measured_at: "measured at {time}"
      of_total: "{done} of {total} ({pct}%)"
      scanned: "{done} processed"
      entity:
        users: Users
        discussions: Discussions
        posts: Posts
        tags: Tags

    run:
      title: Recommended migration order
      intro: >-
        Run top to bottom. The order is enforced by ID / foreign-key
        dependencies — groups before users, users & tags before content, content
        before likes/mentions/etc. Run a whole phase, or individual steps.
      phase1: Run Phase 1
      phase2: Run Phase 2
      all: Run Phase 1 + 2
      running: "Running: {step}…"
      cancel: Cancel
      all_done: Every step in this sequence is already done — nothing to run. Use “Reset” on a step to run it again.

    phases:
      "0":
        title: "Phase 0 — Preparation (optional)"
        desc: Wipe existing Flarum content for a clean re-run (keeps schema, core groups and settings). Destructive.
      "1":
        title: "Phase 1 — Core (order matters)"
        desc: "Groups → Users → Avatars → Tags → Content → Likes → Permissions → Forum perms. IDs and foreign keys depend on this order."
      "2":
        title: "Phase 2 — Secondary content"
        desc: "Runs after users and content exist: subscriptions, private messages, polls, trader feedback, reviews, and promoting your admin."

    images:
      title: Media localization
      intro: >-
        Migrated posts still load their images from wherever they were hosted
        (imgur, the old domain, a dead image host…). This brings those files
        into your own server — same folder fof/upload uses — and rewrites the
        posts to point at the local copies.
      warning: >-
        These two steps hit the network and use disk, so they are never part of
        “Run everything”. Start with a small limit and a dry-run, look at the
        forum, then raise the budget. Files already downloaded are never
        downloaded again, and dead URLs are remembered so they are not retried.
        A host that rate-limits us (HTTP 429) or times out is a different case:
        those URLs are only deferred, and the next run picks them up on its own.
      hosts: URLs to localize
      hosts_count: "{count} host(s)"
      hosts_hint: >-
        Comma-separated hosts or URL prefixes, e.g. “i.imgur.com,
        damnfineshave.com”. A bare host also matches its subdomains.
        Auto-detection fills this with every host found in your posts — prune it
        if you want to leave some out. Leaving it empty and ticking all-hosts on
        the step takes everything external, including hosts not in any post yet.
      limit: Images per run
      max_mb: Total MB per run
      max_file_mb: Max MB per file
      optimize: Optimization on import
      optimize_hint: >-
        Old forum images are camera JPEGs: 3000 px and 2 MB to be displayed at
        700 px. Re-encoding them as they come in typically cuts 80-90% of the
        disk they would take, and this is the only cheap moment to do it —
        afterwards, changing the image format means rewriting the XML of
        thousands of posts. Anything that would get worse (animated GIFs, SVG,
        AVIF, or a result that is not smaller) is stored exactly as downloaded.
      optimize_on: Re-encode images
      webp: Convert to WebP
      no_webp_support: >-
        This PHP has no WebP support (GD without libwebp), so images are
        optimized in their original format instead.
      quality: Quality (30-100)
      max_dim: Longest side (px, 0 = keep)
      host_delay: Delay per host (ms)
      retries: Retries on 429/timeout
      host_delay_hint: >-
        Spacing between requests to the same host, and how many times a
        rate-limited or timed-out download is retried (with backoff, honouring
        Retry-After). Raise the delay if you keep seeing HTTP 429 from imgur.
      attachments_dir: MyBB uploads folder (optional)
      attachments_dir_hint: >-
        Path to the MyBB “uploads” folder. When set, attachments are copied
        straight from disk; otherwise they are downloaded from the old site URL,
        which only works while attachments are publicly readable there.
      directory: Files are written to
      detect: Auto-detect
      detect_failed: Auto-detection failed.
      detect_result: "{hosts} host(s) applied — {images} images across {scanned} posts scanned"
      detect_show_all: "Show the other {count} host(s)"
      detect_sample: (sample)
      detect_uploads_ok: MyBB uploads folder found
      detect_uploads_none: >-
        MyBB uploads folder not found near this install — set it by hand if you
        have it, otherwise attachments fall back to downloading from the old site.
      discussion: Localize one discussion
      discussion_run: Localize this discussion
      discussion_hint: >-
        Paste the discussion URL (or just its id). Only that discussion's images
        are downloaded, with no per-run cap — the cheapest way to see the result
        before running the full sweep. It runs in the background with a progress
        bar.
      save: Save media settings
      saved: Media settings saved.
      no_fof_upload: >-
        fof/upload is not installed. Files are still downloaded and the posts do
        point at the local copies — they just won’t show up in the media
        manager. Install and enable fof/upload, then run the step again to
        register them.
      no_map_table: >-
        Table mybb_migrated_images is missing — run “php flarum migrate” before
        using these steps.
      stats:
        images_ok: Images localized
        images_failed: Images failed
        deferred: Deferred (429/timeout)
        attachments_ok: Attachments migrated
        attachments_failed: Attachments failed
        disk: Disk used

    compare:
      title: Compare formatting (old × Flarum)
      intro: Enter a post ID (same id on both sides — IDs are preserved) to compare the original MyBB post with the migrated Flarum render.
      pid_placeholder: Post ID
      compare: Compare
      random: Random post
      old: Old (MyBB)
      flarum: Flarum
      open_old: Open on old site
      old_unavailable: Could not load the old post inline (login required, offline, or different theme). Use the link above and the source below.
      iframe_note: If the frame stays blank, the old site is behind a bot-check (Cloudflare) or blocks embedding — use "Open on old site" above.
      show_bbcode: Show original BBCode
      no_mybb: Post not found in the MyBB source.
      not_migrated: This post was not migrated to Flarum yet.
      none_found: No post found. Migrate first, or enter a valid post ID.
      cant_embed: "The old site can't be embedded here (X-Frame-Options / Cloudflare). Open it in a new tab to compare with the Flarum render and the source BBCode below."
      bbcode_label: Original BBCode (MyBB source)
      from_db: Rendered from the database (MyBB approximation)
      from_site: From the live old site
      failed: Could not load the comparison.

    cleanup:
      warning: >-
        These are data-specific fidelity passes. Some are opposites of each
        other — do not run them all blindly. Run Phases 1–2 first, look at the
        forum, then apply only what you need.

    status:
      pending: Pending
      running: Running
      done: Done
      failed: Failed
      skipped: Skipped
      stale: Stalled?

    steps:
      run: Run
      dry_run: Dry-run
      dangerous: destructive
      manual: manual — run individually
      warnings: "{count} warning(s) — already-populated items were skipped; nothing stopped:"
      warnings_more: "… and {count} more"
      show_log: Log
      hide_log: Hide log
      reset: Reset
      confirm_dangerous: "Run {name}? This is destructive."
      desc:
        wipe: Clears Flarum content for a clean re-run (keeps schema, core groups and settings).
        groups: Custom groups (gid≥8), IDs preserved.
        users: Users (uid=id), captures passwords, maps roles.
        avatars: Backfills users.avatar_url.
        tags: Forums → tags (fid=id) + hierarchy.
        content: Threads → discussions, posts → posts, BBCode→Flarum, mentions.
        likes: Post likes.
        permissions: Default + custom-group permissions.
        forum-perms: Per-forum view restrictions → tag permissions.
        subscriptions: Thread/forum follows.
        messages: Private messages → fof/byobu.
        polls: Polls + votes → fof/polls.
        trade-feedback: iTrader feedback → traderfeedback.
        reviews: Community Reviews → traderfeedback.
        make-admin: Promote your account to Admin (set the username).
        images: Downloads the remote images used by migrated posts and repoints the posts at the local copies. Skips URLs already localized; remembers dead ones.
        attachments: Migrates MyBB post attachments into local storage and appends them to the migrated posts.
        optimize-media: Re-encodes files already localized (WebP + resize), repoints the posts and the media manager at the new file, then deletes the old one. For anything migrated before optimization existed.
        legacy-passwords: Backfill mybb_legacy_passwords for existing users (carry MyBB passwords to an already-migrated Flarum). Skips users that already have a row.

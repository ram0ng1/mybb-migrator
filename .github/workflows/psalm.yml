name: Psalm Taint

# Análise de taint (fluxo de dados origem→sink) para PHP — pega SQLi/XSS/
# path-traversal que as regras de padrão do Semgrep não veem. O CodeQL não
# cobre PHP; o Psalm taint é o equivalente.
#
# BLOQUEANTE desde o início: o baseline foi pré-verificado limpo localmente
# (psalm 6.17.1, PHP 8.5, "No errors found" sobre src/, migrations/ e
# extend.php), então achado novo de taint reprova o PR.
#
# Ao contrário das outras extensões ramon/*, o vimeo/psalm NÃO está no
# require-dev desta — o composer.json fica enxuto e o Psalm é instalado aqui,
# no runner, junto com as dependências (ver o passo "Resolver dependências").
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 9 * * 1'  # toda segunda, 09:00 UTC
  workflow_dispatch:

# §35.13 C1 — default-deny.
permissions: {}

concurrency:
  group: psalm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Ver o comentário equivalente em ci.yml: menos conexões simultâneas contra uma
  # borda do Packagist em mau estado significa menos chance de topar com ela.
  COMPOSER_MAX_PARALLEL_HTTP: '6'

jobs:
  psalm:
    name: Psalm taint analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF
      actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            packagist.org:443
            repo.packagist.org:443
            getcomposer.org:443
            pecl.php.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.3'
          extensions: dom, mbstring, fileinfo, bcmath, intl, simplexml, tokenizer, sodium, pdo_sqlite
          coverage: none
          tools: composer:v2

      # `composer require` em vez de `update`: adiciona o vimeo/psalm ao
      # require-dev SÓ no checkout do runner e, como o composer.lock não é
      # versionado, resolve o resto das dependências no mesmo passo.
      - name: Resolver dependências (composer require vimeo/psalm)
        run: |
          backoff=(15 30 60 120)
          for i in 0 1 2 3 4; do
            composer require --dev --no-interaction --no-progress --prefer-stable --no-scripts --with-all-dependencies 'vimeo/psalm:^6.0' && exit 0
            [ "$i" -eq 4 ] && break
            echo "::warning::composer falhou (tentativa $((i+1))/5), repetindo em ${backoff[$i]}s"
            sleep "${backoff[$i]}"
          done
          echo "::error::composer não resolveu as dependências em 5 tentativas (~3,75 min). Se o log acusa 502 do repo.packagist.org, é incidente upstream — reexecute o job."
          exit 1

      # Contorno para um crash do Psalm 6.17.x: a partir do illuminate/collections
      # 13.32.0 (2026-09-14), `Collection::prepend()` traz
      # `@phpstan-this-out ($key is null ? static<…> : $this)`. O Psalm lê a
      # anotação mas não registra os parâmetros do método para tipos condicionais
      # em `this-out`, e morre com "Uncaught TypeParseTreeException: Unrecognized
      # template '$key'" ainda na varredura dos autoloads do vendor — antes de
      # analisar qualquer arquivo nosso. A anotação é do PHPStan e não muda nada
      # na análise de taint; remover só as linhas com condicional resolve, e o
      # sed é inócuo quando a versão instalada não as tem. Retirar este passo
      # quando o Psalm passar a aceitar a sintaxe.
      - name: Contornar crash do Psalm em @phpstan-this-out condicional
        run: |
          files=$(grep -rl --include=*.php '@phpstan-this-out (' vendor/illuminate || true)
          if [ -n "$files" ]; then
            echo "$files" | xargs sed -i '/@phpstan-this-out (/d'
            echo "::notice::removida a anotação @phpstan-this-out condicional de: $(echo $files | tr '\n' ' ')"
          fi

      # Bloqueante: o exit do psalm é propagado após garantir que o SARIF
      # exista para upload.
      - name: Psalm taint analysis
        run: |
          set +e
          vendor/bin/psalm --taint-analysis --report=psalm-taint.sarif --no-progress
          EXIT=$?
          [ -f psalm-taint.sarif ] || echo '{"version":"2.1.0","runs":[]}' > psalm-taint.sarif
          ls -l psalm-taint.sarif
          exit $EXIT

      - name: Upload SARIF — Psalm taint
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with:
          sarif_file: psalm-taint.sarif
          category: psalm-taint

      - name: Upload SARIF como artefato
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: psalm-taint-sarif
          path: psalm-taint.sarif
          retention-days: 30
          if-no-files-found: warn
